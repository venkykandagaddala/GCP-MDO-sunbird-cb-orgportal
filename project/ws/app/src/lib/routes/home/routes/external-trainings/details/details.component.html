<div class="details-wrapper">
  <!-- Left Section -->
  <div class="details-left">
    <h2 class="training-title">{{ training.title }}</h2>
    <div class="info-grid">
      <div class="info-block">
        <span class="info-label">TRAINING TYPE</span>
        <span class="info-value">{{ training.learningType }}</span>
      </div>
      <div class="info-block">
        <span class="info-label">DELIVERY MODE</span>
        <span class="info-value">{{ training.deliveryMode }}</span>
      </div>
      <div class="info-block">
        <span class="info-label">LEARNING HOURS</span>
        <span class="info-value">{{ training.learningHours }}</span>
      </div>
      <div class="info-block">
        <span class="info-label">Training Type</span>
        <span class="info-value">{{ training.categoryType }}</span>
      </div>
      <!-- <div class="info-block">
        <span class="info-label">PARTNER NAME</span>
        <span class="info-value">{{ training.partnerName }}</span>
      </div> -->
    </div>

    <div class="objective-section">
      <span class="info-label">LEARNING OBJECTIVE</span>
      <p class="objective-text">{{ training.learningObjective }}</p>
    </div>
  </div>

  </div> -->
</div>
<div class="details-wrapper">
  <!-- Left Section -->
  <div class="details-left">
    <div class="flex new-mobile w-full" *ngIf="training?.competency_v6 && training?.competency_v6?.length > 0">
      <sb-uic-competency-list class="w-full" [selectedCompetencies]="training?.competency_v6" [showCompetencyAdd]="false">
      </sb-uic-competency-list>
    </div>
  </div>
</div>
