<div class="flex flex-4 flex-column">
  <mat-card>
    <div class="flex flex-between mat-h2 margin-remove">External Trainings
      <button mat-button type="button" class="create-cbp-btn" (click)="createNewTraining()">
        <div class="flex gap-2 items-center">
          <mat-icon class="training-upload-icon">upload</mat-icon>
          <span>Upload External Training Details</span>
        </div>
      </button>
    </div>
    <mat-card-content>
      <!-- Search Bar -->
      <div class="search mb-4">
        <div class=rsearch>
          <mat-icon class="search-icon">search</mat-icon>
          <input class="sinput" type="Standard" label="" placeholder="Search trainings..." [(ngModel)]="searchQuery" (keydown.enter)="onSearch()">
        </div>
      </div>

      <!-- Content Area -->
      <ng-container class="margin-top-l" *ngIf="fetchContentDone">
        <div class="table-container">
          <div class="mat-elevation-1">
            <!-- Table -->
            <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="full-width"
              *ngIf="externalTrainingsData?.length > 0">

              <!-- Training Name Column -->
              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="name" class="col-training-name">Training
                  Name</th>
                <td mat-cell *matCellDef="let element" class="color-87 h-400-r-14-l col-training-name">
                  {{element?.name}}</td>
              </ng-container>

              <!-- Provider Column -->
              <!-- <ng-container matColumnDef="sourceName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="sourceName">Provider</th>
                <td mat-cell *matCellDef="let element" class="color-87 h-400-r-14-l">{{element?.sourceName}}</td>
              </ng-container> -->

              <!-- Delivery Mode Column -->
              <ng-container matColumnDef="deliveryMode">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="eventType">Delivery Mode</th>
                <td mat-cell *matCellDef="let element" class="color-87 h-400-r-14-l">{{element?.eventType}}</td>
              </ng-container>

              <!-- Duration Column -->
              <ng-container matColumnDef="duration">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="durationFormatted">Duration</th>
                <td mat-cell *matCellDef="let element" class="color-87 h-400-r-14-l">{{element?.durationFormatted}}</td>
              </ng-container>

              <!-- Created On Column -->
              <ng-container matColumnDef="createdOn">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="createdOn">Created On</th>
                <td mat-cell *matCellDef="let element" class="color-87 h-400-r-14-l">{{element?.createdOnFormatted}}
                </td>
              </ng-container>

              <!-- Actions Column -->
              <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef style="text-align: center;">Action</th>
                <td mat-cell *matCellDef="let element; let i = index" style="text-align: center;">
                  <button mat-icon-button [matMenuTriggerFor]="actionMenu" [id]="'menu-trigger-' + i" (click)="prepareActions()">
                    <mat-icon>more_horiz</mat-icon>
                  </button>
                  <mat-menu #actionMenu="matMenu">
                    <button class="external-traings-actions" mat-menu-item *ngFor="let action of currentRowActions; trackBy: trackByActionKey"
                      (click)="menuSelected(element, action.key); $event.stopPropagation()">
                      <mat-icon class="my-icon">{{action.icon}}</mat-icon>
                      <span>{{action.name}}</span>
                    </button>
                  </mat-menu>
                </td>
              </ng-container>

              <!-- Table Structure -->
              <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <!-- No Data Message -->
            <div *ngIf="externalTrainingsData?.length === 0" class="no-data-container-table">
              <img src="/assets/images/no-content-data-search.svg" alt="No external trainings found" class="no-data-image">
              <h3>No External Trainings Found</h3>
              <p>There are no external trainings available at the moment.</p>
            </div>

            <!-- Paginator -->
            <mat-paginator [length]="totalCount" [pageIndex]="pageIndex" [pageSize]="limit" [pageSizeOptions]="[20, 50, 100]"
              (page)="onPaginateChange($event)" showFirstLastButtons>
            </mat-paginator>
          </div>
        </div>
      </ng-container>

      <!-- Loading Spinner -->
      <div *ngIf="!fetchContentDone" class="loading-container">
        <mat-spinner diameter="50"></mat-spinner>
      </div>

    </mat-card-content>
  </mat-card>
</div>
